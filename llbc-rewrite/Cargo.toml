[package]
name = "llbc-rewrite"
version = "0.1.0"
edition = "2024"

[dependencies]
charon = { git = "https://github.com/AeneasVerif/charon", rev = "de8736f7c", version = "0.1.293", default-features = false }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[features]
# Builds the integration tests, which need `charon` and `aeneas` on `PATH`
integration-test = []

[[test]]
name = "dyn_param_to_type_param"
required-features = ["integration-test"]

[dev-dependencies]
tempfile = "3.27.0"
