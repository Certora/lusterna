[project]
name = "lusterna"
version = "0.1.0"
description = "Rust-to-Lean formal verification agent"
requires-python = ">=3.10"
dependencies = [
    # The pipeline spawns Claude Code (the `claude` CLI, installed in the container image) as the
    # engine for every stage, driven over `docker exec` — so no in-process LLM SDK is needed.
    # pydantic-ai / pydantic were retired with the spawn-model migration.
    "click>=8.0",
]

[tool.setuptools.packages.find]
include = ["lusterna*"]

[project.scripts]
lusterna = "lusterna.cli:main"
