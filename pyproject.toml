[project]
name = "lusterna"
version = "0.1.0"
description = "Rust-to-Lean formal verification agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai[anthropic]>=0.1.0",
    "pydantic>=2.0",
    "click>=8.0",
]

[tool.setuptools.packages.find]
include = ["lusterna*"]

[project.scripts]
lusterna = "lusterna.cli:main"
