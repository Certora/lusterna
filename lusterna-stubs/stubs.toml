# The crates that lusterna-stubs replaces in the Charon build of a Solana
# crate. Each one has a stub crate of the same name in a folder of the same
# name.
#
# `lean`: the module of `LusternaLib` with the Lean models of the items of
# the crate. lusterna makes the items of such a crate opaque and imports the
# module. A crate without `lean` has no items in the extraction, for example
# a proc macro.
#
# `overflow_settings`: whether the models take a `Lusterna.OverflowSettings`.
# lusterna then declares its instance with the overflow settings that the
# release profile gives to the crate.

[[stub]]
crate = "fixed"
lean = "LusternaLib.Fixed"
overflow_settings = true

[[stub]]
crate = "fixed-macro-impl"

[[stub]]
crate = "uint"
lean = "LusternaLib.Uint"
