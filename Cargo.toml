[workspace]
members = ["lusterna-stubs/fixed", "lusterna-stubs/fixed-macro-impl"]

[package]
name = "lusterna"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
derive_more = { version = "2.1.1", features = ["display"] }
env_logger = "0.11.11"
humantime = "2.4.0"
log = "0.4.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml_edit = "0.25.17"
uuid = { version = "1.28.0", features = ["v4"] }

[features]
# Skips the tests that need `lake` on `PATH`
no-lake = []
# Builds the integration tests, which need `charon`, `aeneas` and `lake` on
# `PATH`, `AENEAS_ROOT` set, and network access
integration-test = []

[[test]]
name = "translate_setup"
required-features = ["integration-test"]

[dev-dependencies]
tempfile = "3.27.0"
